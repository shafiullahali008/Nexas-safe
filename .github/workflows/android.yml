name: Build Nexas Safe APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: |
          unzip NexasSafe-Android-Source.zip
          cd NexasSafe

      - name: Build APK
        run: |
          cd NexasSafe
          gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: NexasSafe-APK
          path: NexasSafe/app/build/outputs/apk/debug/*.apk
